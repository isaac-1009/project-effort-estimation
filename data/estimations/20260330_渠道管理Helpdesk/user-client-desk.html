<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道管理Helpdesk</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7B5CF5;
    --primary-light: #9B7FF8;
    --primary-dark: #5B3DD5;
    --primary-bg: #F0EDFF;
    --surface: #ffffff;
    --bg: #F5F5FA;
    --text: #1A1A2E;
    --text-muted: #6B6B8A;
    --border: #E8E5F5;
    --shadow: 0 4px 24px rgba(123,92,245,0.10);
    --radius-sm: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #ECEAF8;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }

  /* ── Phone shell ── */
  .phone {
    width: 320px; height: 680px;
    background: var(--bg);
    border-radius: 40px;
    box-shadow: 0 24px 60px rgba(80,50,180,0.22), 0 4px 12px rgba(0,0,0,0.10);
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
  }

  /* ── Status bar ── */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 6px; font-size: 11px; font-weight: 700;
    color: var(--text); background: var(--bg); flex-shrink: 0;
  }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }
  .status-bar .icons svg { width: 14px; height: 14px; }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center;
    padding: 6px 16px 12px; background: var(--bg);
    gap: 10px; flex-shrink: 0;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--primary-bg); color: var(--primary); }
  .topbar .title { flex: 1; text-align: center; font-weight: 700; font-size: 15px; color: var(--text); }
  .topbar .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700;
  }

  /* ── Chat screen ── */
  .chat-screen { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 0; }

  .msg-row {
    display: flex; align-items: flex-end; gap: 8px;
    animation: fadeUp 0.28s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-row.system-row { justify-content: center; }

  .bot-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #C8BFFF, #7B5CF5);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(123,92,245,0.25);
  }

  .bubble {
    max-width: 230px; padding: 10px 14px;
    border-radius: 18px; font-size: 13px; line-height: 1.65;
  }
  .bubble.bot {
    background: var(--surface); color: var(--text);
    border-bottom-left-radius: 4px; box-shadow: var(--shadow);
  }
  .bubble.user {
    background: var(--primary); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.system {
    background: rgba(123,92,245,0.07); color: var(--text-muted);
    font-size: 11px; border-radius: 20px; padding: 4px 14px;
    max-width: 260px; text-align: center;
  }
  .bubble-actions {
    display: flex; gap: 10px; margin-top: 5px;
    font-size: 14px; color: var(--text-muted);
  }
  .bubble-actions span { cursor: pointer; transition: color 0.15s; }
  .bubble-actions span:hover { color: var(--primary); }

  /* ── 引导菜单 ── */
  .guide-heading {
    font-size: 12px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5;
  }
  .guide-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .guide-card {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px;
    background: var(--primary-bg);
    border: 1.5px solid transparent;
    border-radius: 10px;
    cursor: pointer; transition: all 0.18s;
    user-select: none;
  }
  .guide-card:hover { border-color: var(--primary-light); }
  .guide-card:active { transform: scale(0.97); background: var(--primary); }
  .guide-card:active .guide-num,
  .guide-card:active .guide-label { color: #fff; }
  .guide-num {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
    transition: background 0.18s;
  }
  .guide-card:active .guide-num { background: #fff; color: var(--primary); }
  .guide-label { font-size: 11px; font-weight: 600; color: var(--primary); line-height: 1.3; }

  /* ── FAQ 子菜单 ── */
  .faq-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .faq-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px;
    background: var(--primary-bg);
    cursor: pointer; transition: all 0.18s;
    font-size: 12px; font-weight: 500; color: var(--text);
  }
  .faq-item:hover { background: var(--primary); color: #fff; }
  .faq-item:active { transform: scale(0.97); }
  .faq-letter {
    width: 20px; height: 20px; border-radius: 5px;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0;
    transition: all 0.18s;
  }
  .faq-item:hover .faq-letter { background: #fff; color: var(--primary); }

  /* ── Quick chips ── */
  .quick-chips {
    display: flex; gap: 8px; padding: 8px 16px;
    flex-shrink: 0; background: var(--bg);
    flex-wrap: wrap;
  }
  .chip {
    padding: 6px 14px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 50px; font-size: 12px; white-space: nowrap;
    cursor: pointer; color: var(--text); font-weight: 500;
    transition: all 0.18s; flex-shrink: 0; font-family: inherit;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }

  /* ── Input bar ── */
  .input-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px 18px; background: var(--bg); flex-shrink: 0;
  }
  .end-chat-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #FEF2F2; border: 1.5px solid #FCA5A5;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; color: #DC2626;
    transition: all 0.2s;
  }
  .end-chat-btn:hover {
    background: #FEE2E2; border-color: #F87171;
    transform: scale(1.06);
  }
  .end-chat-btn:active { transform: scale(0.95); }
  .end-chat-btn svg { width: 18px; height: 18px; }
  .input-wrap {
    flex: 1; background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 50px;
    display: flex; align-items: center; padding: 0 14px;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: var(--primary); }
  .input-wrap input {
    flex: 1; border: none; background: transparent;
    font-size: 13px; padding: 9px 0; outline: none;
    color: var(--text); font-family: inherit;
  }
  .input-wrap input::placeholder { color: #BBBBD0; }
  .send-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--primary); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(123,92,245,0.35);
    transition: background 0.2s;
  }
  .send-btn:hover { background: var(--primary-dark); }
  .send-btn svg { width: 17px; height: 17px; fill: #fff; }

  /* ── 结束确认弹窗 ── */
  .confirm-overlay {
    position: absolute; inset: 0; z-index: 70;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,26,46,0.45); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    border-radius: 40px;
  }
  .confirm-overlay.show { opacity: 1; pointer-events: all; }
  .confirm-card {
    width: 82%; background: var(--surface);
    border-radius: 20px; padding: 26px 22px 20px;
    box-shadow: 0 20px 56px rgba(0,0,0,0.20);
    transform: translateY(16px) scale(0.95);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    text-align: center;
  }
  .confirm-overlay.show .confirm-card { transform: translateY(0) scale(1); }
  .confirm-icon {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #FEE2E2, #FECACA);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 14px; color: #DC2626;
  }
  .confirm-icon svg { width: 24px; height: 24px; }
  .confirm-title {
    font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px;
  }
  .confirm-sub {
    font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;
  }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btn {
    flex: 1; padding: 11px; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; border: none; transition: all 0.18s;
  }
  .confirm-btn-cancel { background: var(--bg); color: var(--text-muted); }
  .confirm-btn-cancel:hover { background: var(--border); color: var(--text); }
  .confirm-btn-end {
    background: #DC2626; color: #fff;
    box-shadow: 0 4px 12px rgba(220,38,38,0.30);
  }
  .confirm-btn-end:hover { background: #B91C1C; }

  /* ── History drawer ── */
  .history-drawer {
    position: absolute; inset: 0; z-index: 50;
    pointer-events: none; border-radius: 40px; overflow: hidden;
  }
  .drawer-overlay {
    position: absolute; inset: 0;
    background: rgba(26,26,46,0.38);
    opacity: 0; transition: opacity 0.30s ease; cursor: pointer;
  }
  .drawer-panel {
    position: absolute; top: 0; bottom: 0; left: 0; width: 82%;
    background: var(--surface);
    display: flex; flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 6px 0 40px rgba(123,92,245,0.18);
  }
  .history-drawer.open { pointer-events: all; }
  .history-drawer.open .drawer-overlay { opacity: 1; }
  .history-drawer.open .drawer-panel { transform: translateX(0); }
  .drawer-header {
    display: flex; align-items: center;
    padding: 54px 18px 14px; border-bottom: 1px solid var(--border);
    gap: 8px; background: var(--bg);
  }
  .drawer-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
  .drawer-count {
    font-size: 11px; font-weight: 700;
    background: var(--primary-bg); color: var(--primary);
    padding: 2px 8px; border-radius: 20px;
  }
  .drawer-close {
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; color: var(--text-muted);
    transition: background 0.15s;
  }
  .drawer-close:hover { background: var(--primary-bg); color: var(--primary); }
  .drawer-list {
    flex: 1; overflow-y: auto; padding: 14px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .drawer-list::-webkit-scrollbar { width: 0; }
  .history-item {
    padding: 11px 14px; background: var(--bg);
    border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text); font-weight: 500;
    cursor: pointer; transition: all 0.18s;
  }
  .history-item:hover { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
  .history-item svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-muted); }
  .drawer-footer { padding: 12px 14px 28px; }
  .new-chat-btn {
    width: 100%; padding: 13px; border-radius: 50px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; font-size: 14px; font-weight: 700;
    border: none; cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 20px rgba(123,92,245,0.28);
    transition: all 0.2s;
  }
  .new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(123,92,245,0.38); }

  /* ── 满意度评分弹窗 ── */
  .rating-overlay {
    position: absolute; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,26,46,0.5); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    border-radius: 40px;
  }
  .rating-overlay.show { opacity: 1; pointer-events: all; }

  .rating-card {
    width: 88%; background: var(--surface);
    border-radius: 22px; padding: 28px 22px 22px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    transform: translateY(20px) scale(0.95);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .rating-overlay.show .rating-card { transform: translateY(0) scale(1); }

  .rating-emoji {
    text-align: center; font-size: 40px; margin-bottom: 8px;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .rating-emoji.bounce { transform: scale(1.3); }

  .rating-title {
    font-size: 17px; font-weight: 700; color: var(--text); text-align: center;
  }
  .rating-sub {
    font-size: 12px; color: var(--text-muted); text-align: center;
    margin: 4px 0 18px;
  }

  .rating-stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; }
  .rating-star {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer;
    background: var(--bg); border: 2px solid var(--border);
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    user-select: none;
  }
  .rating-star:hover {
    transform: scale(1.18); border-color: var(--primary-light);
    box-shadow: 0 4px 12px rgba(123,92,245,0.2);
  }
  .rating-star.lit {
    background: linear-gradient(135deg, #FBBF24, #F59E0B);
    border-color: #F59E0B; transform: scale(1.08);
    box-shadow: 0 4px 16px rgba(245,158,11,0.35);
  }
  .rating-star.lit:hover { transform: scale(1.2); }

  .rating-label {
    text-align: center; font-size: 13px; font-weight: 600;
    color: var(--primary); min-height: 20px; margin-bottom: 16px;
    transition: color 0.2s;
  }

  .rating-textarea {
    width: 100%; border: 1.5px solid var(--border);
    border-radius: 12px; padding: 10px 12px;
    font-size: 13px; font-family: inherit;
    resize: none; min-height: 56px;
    outline: none; background: var(--bg); color: var(--text);
    transition: border-color 0.2s;
  }
  .rating-textarea:focus { border-color: var(--primary); background: var(--surface); }
  .rating-textarea::placeholder { color: #BBBBD0; }

  .rating-btns { display: flex; gap: 10px; margin-top: 16px; }
  .rating-btn {
    flex: 1; padding: 12px; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; border: none; transition: all 0.18s;
  }
  .rating-btn-skip { background: var(--bg); color: var(--text-muted); }
  .rating-btn-skip:hover { background: var(--border); color: var(--text); }
  .rating-btn-submit {
    background: var(--primary); color: #fff;
    box-shadow: 0 4px 12px rgba(123,92,245,0.35);
  }
  .rating-btn-submit:hover { background: var(--primary-dark); }
  .rating-btn-submit:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  /* thank-you state */
  .rating-thanks {
    text-align: center; padding: 16px 0 8px;
  }
  .rating-thanks-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #34D399, #10B981);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; margin-bottom: 12px;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .rating-thanks-text {
    font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px;
  }
  .rating-thanks-sub {
    font-size: 12px; color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- Top bar -->
  <div class="topbar">
    <button class="icon-btn" id="menuBtn">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="1" x2="18" y2="1"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="13" x2="18" y2="13"/>
      </svg>
    </button>
    <div class="title">渠道管理Helpdesk</div>
    <div class="avatar">U</div>
  </div>

  <!-- Chat -->
  <div class="chat-screen">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="quick-chips" id="quickChips">
      <button class="chip" onclick="sendChip(this)">查询账户余额</button>
      <button class="chip" onclick="sendChip(this)">查询可开单量</button>
      <button class="chip" onclick="sendChip(this)">查询合同状态</button>
    </div>
    <div class="input-bar">
      <button class="end-chat-btn" id="endChatBtn" onclick="showConfirm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
          <rect x="4" y="2" width="16" height="4" rx="1" fill="currentColor" stroke="none" opacity="0.25"/>
        </svg>
      </button>
      <div class="input-wrap">
        <input type="text" id="chatInput" placeholder="输入您的问题…">
      </div>
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- History drawer -->
  <div class="history-drawer" id="historyDrawer">
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer-panel">
      <div class="drawer-header">
        <span class="drawer-title">历史对话</span>
        <span class="drawer-count" id="historyCount">0</span>
        <button class="drawer-close" id="drawerClose">✕</button>
      </div>
      <div class="drawer-list" id="historyList">
        <div style="text-align:center;color:var(--text-muted);font-size:12px;padding:24px 0;">暂无历史对话</div>
      </div>
      <div class="drawer-footer">
        <button class="new-chat-btn" onclick="resetChat()">开始新对话</button>
      </div>
    </div>
  </div>

  <!-- 结束对话确认弹窗 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-card">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="confirm-title">结束当前对话？</div>
      <div class="confirm-sub">结束后将无法继续本次咨询，<br>您可随时开始新的对话。</div>
      <div class="confirm-btns">
        <button class="confirm-btn confirm-btn-cancel" onclick="closeConfirm()">取消</button>
        <button class="confirm-btn confirm-btn-end" onclick="confirmEnd()">结束对话</button>
      </div>
    </div>
  </div>

  <!-- 满意度评分弹窗 -->
  <div class="rating-overlay" id="ratingOverlay">
    <div class="rating-card" id="ratingCard">
      <div class="rating-emoji" id="ratingEmoji">😊</div>
      <div class="rating-title">对话已结束</div>
      <div class="rating-sub">请为本次服务打分</div>
      <div class="rating-stars" id="ratingStars">
        <span class="rating-star" data-v="1">😡</span>
        <span class="rating-star" data-v="2">😕</span>
        <span class="rating-star" data-v="3">😐</span>
        <span class="rating-star" data-v="4">😊</span>
        <span class="rating-star" data-v="5">🤩</span>
      </div>
      <div class="rating-label" id="ratingLabel">&nbsp;</div>
      <textarea class="rating-textarea" id="ratingComment" placeholder="请输入您的意见和建议（选填）…" rows="2"></textarea>
      <div class="rating-btns">
        <button class="rating-btn rating-btn-skip" onclick="closeRating()">跳过</button>
        <button class="rating-btn rating-btn-submit" id="ratingSubmitBtn" onclick="submitRating()" disabled>提交评价</button>
      </div>
    </div>
  </div>

</div>

<script>
  /* ── DOM refs ── */
  const drawer   = document.getElementById('historyDrawer');
  const dOverlay = document.getElementById('drawerOverlay');
  const dClose   = document.getElementById('drawerClose');
  const menuBtn  = document.getElementById('menuBtn');
  const msgs     = document.getElementById('chatMessages');
  const input    = document.getElementById('chatInput');
  const sendBtn  = document.getElementById('sendBtn');

  menuBtn.addEventListener('click', () => drawer.classList.add('open'));
  dOverlay.addEventListener('click', () => drawer.classList.remove('open'));
  dClose.addEventListener('click', () => drawer.classList.remove('open'));

  /* ── FAQ config ── */
  const menuConfig = [
    { id:1, name:'经销商授权',   admin:'同事A' },
    { id:2, name:'指标政策',     admin:'同事A' },
    { id:3, name:'点配送',       admin:'同事B' },
    { id:4, name:'合规',         admin:'同事B' },
    { id:5, name:'经销商上新',   admin:'同事B' },
    { id:6, name:'特殊备案',     admin:'同事B' },
  ];
  const faqData = {
    1: [
      { q:'授权一般用时多久？', a:'经销商授权申请一般需要 3~5 个工作日审核。如需加急，请提供相关凭证。' },
      { q:'授权流程是什么？', a:'授权流程：\n1. 提交申请资料\n2. 区域审核\n3. 总部审批\n4. 签署协议\n5. 系统开通' },
      { q:'授权需要什么材料？', a:'需要：营业执照、税务登记证、法人身份证、经营场所证明。' },
    ],
    2: [
      { q:'Q4指标怎么核算？', a:'Q4指标根据季度销售额、新开发客户数、回款率综合核算，详见指标政策文件。' },
      { q:'指标未完成怎么办？', a:'指标未完成会影响返利，建议及时与区域经理沟通制定补差方案。' },
    ],
    3: [
      { q:'配送时效多久？', a:'省内 2-3 天，跨省 3-5 天，偏远地区可能更长。' },
      { q:'配送延误怎么办？', a:'请联系客服，我们会协调物流跟进并给出解决方案。' },
    ],
    4: [
      { q:'合规检查需要什么资料？', a:'营业执照、合同副本、近 3 个月银行流水。' },
      { q:'合规备案流程？', a:'资料提交 → 初审 → 复审 → 备案完成，一般 1-2 周。' },
    ],
    5: [
      { q:'上新需要什么条件？', a:'完成产品培训、通过考核、签署新品销售协议。' },
      { q:'新品培训在哪里？', a:'美外之家学习中心，完成培训后自动获得销售资格。' },
    ],
    6: [
      { q:'特殊备案需要多久？', a:'5-7 个工作日，视具体情况而定。' },
      { q:'备案被拒怎么办？', a:'会告知原因，可根据原因补充材料后重新申请。' },
    ],
  };
  const ratingLabels = ['', '非常不满意', '不太满意', '一般', '比较满意', '非常满意'];
  const ratingEmojis = ['', '😡', '😕', '😐', '😊', '🤩'];

  let currentMenu = null;
  let chatHistory = [];

  /* ── Chat helpers ── */
  function appendMsg(role, html) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (role === 'user' ? ' user' : '');
    row.innerHTML = role === 'user'
      ? `<div class="bubble user">${html}</div>`
      : `<div class="bot-avatar">🤖</div><div><div class="bubble bot">${html}</div></div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendSystem(text) {
    const row = document.createElement('div');
    row.className = 'msg-row system-row';
    row.innerHTML = `<div class="bubble system">${text}</div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function sendMessage(text) {
    if (!text.trim()) return;
    appendMsg('user', text);
    setTimeout(() => appendMsg('bot', '正在为您查询，请稍候……'), 500);
  }

  sendBtn.addEventListener('click', () => { sendMessage(input.value); input.value = ''; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { sendMessage(input.value); input.value = ''; } });
  function sendChip(el) { sendMessage(el.textContent); }

  /* ── 引导菜单 ── */
  function showGuideMenu() {
    let html = '<div class="guide-heading">您想询问以下哪种问题？<br>请选择类别：</div><div class="guide-grid">';
    menuConfig.forEach(m => {
      html += `<div class="guide-card" onclick="selectMenu(${m.id})"><span class="guide-num">${m.id}</span><span class="guide-label">${m.name}</span></div>`;
    });
    html += '</div>';
    appendMsg('bot', html);
  }

  function selectMenu(id) {
    const menu = menuConfig.find(m => m.id === id);
    if (!menu) return;
    currentMenu = menu;
    appendMsg('user', `【${id}】${menu.name}`);
    // appendSystem(`已转接至 ${menu.admin}`);

    setTimeout(() => {
      const faqs = faqData[id] || [];
      let html = `<strong>【${menu.name}】常见问题：</strong><div class="faq-list">`;
      faqs.forEach((f, i) => {
        const letter = String.fromCharCode(65 + i);
        html += `<div class="faq-item" onclick="selectFAQ(${id},'${letter}')"><span class="faq-letter">${letter}</span><span>${f.q}</span></div>`;
      });
      html += `<div class="faq-item" onclick="transferHuman()"><span class="faq-letter" style="background:#EF4444;">D</span><span>其他问题，转人工客服</span></div>`;
      html += '</div>';
      appendMsg('bot', html);
    }, 200);
  }

  function selectFAQ(menuId, letter) {
    const faqs = faqData[menuId] || [];
    const idx = letter.charCodeAt(0) - 65;
    const faq = faqs[idx];
    if (!faq) return;
    appendMsg('user', letter);
    setTimeout(() => {
      appendMsg('bot', faq.a.replace(/\n/g, '<br>'));
    }, 200);
  }

  function transferHuman() {
    if (!currentMenu) return;
    appendMsg('user', 'D');
    appendSystem(`正在为您连接 ${currentMenu.admin}…`);
    setTimeout(() => {
      appendMsg('bot', `您好，我是${currentMenu.admin}，请问有什么可以帮您？`);
    }, 600);
  }

  function resetChat() {
    drawer.classList.remove('open');
    msgs.innerHTML = '';
    currentMenu = null;
    showGuideMenu();
  }

  /* ── History ── */
  function updateHistory() {
    const el = document.getElementById('historyList');
    const countEl = document.getElementById('historyCount');
    countEl.textContent = chatHistory.length;
    if (!chatHistory.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:12px;padding:24px 0;">暂无历史对话</div>';
      return;
    }
    el.innerHTML = chatHistory.map(h =>
      `<div class="history-item" onclick="loadHistory('${h}')"><span>${h}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>`
    ).join('');
  }

  function loadHistory(text) {
    drawer.classList.remove('open');
    msgs.innerHTML = '';
    appendMsg('user', text);
    setTimeout(() => appendMsg('bot', '正在为您查询历史记录，请稍候……'), 550);
  }

  /* ── 结束对话确认 ── */
  function showConfirm() {
    document.getElementById('confirmOverlay').classList.add('show');
  }
  function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('show');
  }
  function confirmEnd() {
    closeConfirm();
    setTimeout(showRating, 200);
  }

  /* ── 满意度评分 ── */
  let ratingValue = 0;

  function showRating() {
    ratingValue = 0;
    document.querySelectorAll('.rating-star').forEach(s => s.classList.remove('lit'));
    document.getElementById('ratingComment').value = '';
    document.getElementById('ratingSubmitBtn').disabled = true;
    document.getElementById('ratingLabel').innerHTML = '&nbsp;';
    document.getElementById('ratingEmoji').textContent = '😊';
    /* reset card in case it was in thank-you state */
    const card = document.getElementById('ratingCard');
    card.innerHTML = buildRatingHTML();
    document.getElementById('ratingOverlay').classList.add('show');
    bindStarEvents();
  }

  function buildRatingHTML() {
    return `
      <div class="rating-emoji" id="ratingEmoji">😊</div>
      <div class="rating-title">对话已结束</div>
      <div class="rating-sub">请为本次服务打分</div>
      <div class="rating-stars" id="ratingStars">
        <span class="rating-star" data-v="1">😡</span>
        <span class="rating-star" data-v="2">😕</span>
        <span class="rating-star" data-v="3">😐</span>
        <span class="rating-star" data-v="4">😊</span>
        <span class="rating-star" data-v="5">🤩</span>
      </div>
      <div class="rating-label" id="ratingLabel">&nbsp;</div>
      <textarea class="rating-textarea" id="ratingComment" placeholder="请输入您的意见和建议（选填）…" rows="2"></textarea>
      <div class="rating-btns">
        <button class="rating-btn rating-btn-skip" onclick="closeRating()">跳过</button>
        <button class="rating-btn rating-btn-submit" id="ratingSubmitBtn" onclick="submitRating()" disabled>提交评价</button>
      </div>`;
  }

  function bindStarEvents() {
    const stars = document.querySelectorAll('.rating-star');
    const emoji = document.getElementById('ratingEmoji');
    const label = document.getElementById('ratingLabel');
    const btn  = document.getElementById('ratingSubmitBtn');

    stars.forEach(star => {
      star.addEventListener('click', function() {
        ratingValue = parseInt(this.dataset.v);
        stars.forEach(s => s.classList.toggle('lit', parseInt(s.dataset.v) <= ratingValue));
        emoji.textContent = ratingEmojis[ratingValue];
        emoji.classList.add('bounce');
        setTimeout(() => emoji.classList.remove('bounce'), 300);
        label.textContent = ratingLabels[ratingValue];
        btn.disabled = false;
      });
      star.addEventListener('mouseenter', function() {
        const v = parseInt(this.dataset.v);
        stars.forEach(s => s.classList.toggle('lit', parseInt(s.dataset.v) <= v));
        emoji.textContent = ratingEmojis[v];
        label.textContent = ratingLabels[v];
      });
    });
    document.getElementById('ratingStars').addEventListener('mouseleave', () => {
      stars.forEach(s => s.classList.toggle('lit', parseInt(s.dataset.v) <= ratingValue));
      emoji.textContent = ratingEmojis[ratingValue] || '😊';
      label.textContent = ratingLabels[ratingValue] || '';
      if (!ratingValue) label.innerHTML = '&nbsp;';
    });
  }

  function closeRating() {
    document.getElementById('ratingOverlay').classList.remove('show');
    setTimeout(() => {
      if (chatHistory.length < 5) chatHistory.push('渠道管理咨询');
      updateHistory();
      msgs.innerHTML = '';
      appendMsg('bot', '感谢使用渠道管理Helpdesk，欢迎随时再来咨询！');
      setTimeout(showGuideMenu, 1500);
    }, 250);
  }

  function submitRating() {
    if (!ratingValue) return;
    const comment = document.getElementById('ratingComment').value.trim();
    const card = document.getElementById('ratingCard');
    card.innerHTML = `
      <div class="rating-thanks">
        <div class="rating-thanks-icon">✓</div>
        <div class="rating-thanks-text">感谢您的反馈！</div>
        <div class="rating-thanks-sub">${ratingValue} 星${comment ? ' · 已收到您的建议' : ''}</div>
      </div>`;
    setTimeout(closeRating, 1400);
  }

  /* ── Init ── */
  showGuideMenu();
  updateHistory();
</script>
</body>
</html>
